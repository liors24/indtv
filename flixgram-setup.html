<!doctype html><html dir=rtl lang=he><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><meta name=robots content=noindex><title>Flixgram · חיבור הטלוויזיה</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font:16px/1.5 system-ui,-apple-system,Segoe UI,Rubik,sans-serif;background:#06070a;color:#f2f1ee;display:flex;align-items:center;justify-content:center;padding:20px;background-image:radial-gradient(120% 60% at 50% -10%,rgba(255,138,76,.32),transparent 60%)}.card{width:100%;max-width:440px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:28px}.dot{width:14px;height:14px;border-radius:50%;background:#ffb27a;box-shadow:0 0 24px #ffb27a;margin-bottom:18px}h1{font-size:24px;margin:0 0 12px;letter-spacing:-.01em}ol{padding-inline-start:20px;color:#bdbab3;margin:0 0 18px}li{margin:6px 0}a{color:#ffc39a}.nw{white-space:nowrap}.row{display:flex;justify-content:space-between;align-items:center;direction:ltr;margin:16px 0 0}label{font-size:13px;color:#9a978f}.state{font-size:13px;font-weight:600;color:#9a978f}.state.good{color:#7be0a6}input.good{border-color:#7be0a6}button:disabled{opacity:.45}.tip{font-size:14px;color:#9a978f;margin:0 0 4px}input{display:block;width:100%;margin-top:6px;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.4);color:#fff;font:16px ui-monospace,Menlo,monospace;direction:ltr}input:focus{outline:none;border-color:#ffb27a}button{margin-top:22px;width:100%;padding:16px;border:0;border-radius:999px;background:#ffb27a;color:#1a0d06;font-weight:700;font-size:17px}.err{color:#ff8a8a}.ok{text-align:center}.big{font-size:56px;color:#ffb27a}</style></head><body><div class=card id=main><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='64' height='64' style='display:block;margin-bottom:18px'><defs><linearGradient id='beam' x1='0' x2='1'><stop offset='0' stop-color='#fff3dd' stop-opacity='1'/><stop offset='.55' stop-color='#ffd9b0' stop-opacity='.75'/><stop offset='1' stop-color='#ff9a6a' stop-opacity='.25'/></linearGradient><radialGradient id='room' cx='.28' cy='.3' r='.75'><stop offset='0' stop-color='#ff8a4c' stop-opacity='.55'/><stop offset='.45' stop-color='#9c3b8a' stop-opacity='.28'/><stop offset='1' stop-color='#0e0b14' stop-opacity='0'/></radialGradient><filter id='bl' x='-100%' y='-100%' width='300%' height='300%'><feGaussianBlur stdDeviation='12'/></filter><clipPath id='tile'><rect width='300' height='300' rx='66'/></clipPath></defs><g clip-path='url(#tile)'><rect width='300' height='300' fill='#0e0b14'/><rect width='300' height='300' fill='url(#room)'/><path d='M66 150 L250 62 Q262 57 262 70 L262 230 Q262 243 250 238 Z' fill='url(#beam)'/><circle cx='66' cy='150' r='30' fill='#fff3dd' filter='url(#bl)' opacity='.9'/><circle cx='66' cy='150' r='19' fill='#fff3dd'/><path d='M172 116 Q166 112 166 120 L166 180 Q166 188 172 184 L216 156 Q222 150 216 144 Z' fill='#0e0b14'/></g></svg><h1>חיבור Flixgram לטלגרם</h1><ol><li>היכנסו ל־<a href='https://my.telegram.org/apps' target=_blank>my.telegram.org</a> עם המספר שלכם</li><li>בחרו <b><bdi>API development tools</bdi></b> וצרו אפליקציה (שם כלשהו)</li><li>העתיקו לכאן את שני הקודים מהדף: <b><bdi class=nw>App api_id</bdi></b> ו־<b><bdi class=nw>App api_hash</bdi></b></li></ol><p class=tip>אפשר להעתיק ולהדביק. גם אם המקלדת בעברית, האותיות יתוקנו לאנגלית לבד. הפרטים מוצפנים בדרך לטלוויזיה.</p><p class=err id=err></p><form autocomplete=off><div class=row><label for=api_id>api_id</label><b class=state id=s1></b></div><input id=api_id name=api_id lang=en dir=ltr inputmode=numeric pattern='[0-9]*' autocomplete=off autocorrect=off autocapitalize=off spellcheck=false placeholder=1234567 required><div class=row><label for=api_hash>api_hash</label><b class=state id=s2></b></div><input id=api_hash name=api_hash lang=en dir=ltr inputmode=latin autocomplete=off autocorrect=off autocapitalize=off spellcheck=false placeholder='32 characters: 0-9, a-f' required><button disabled>שליחה לטלוויזיה</button></form></div><script>(function(){
var link=(location.hash||'').slice(1).split('.');var topic=link[0]||'',key=link[1]||'';
function unb64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
function b64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
if(!/^flixgram-[0-9a-f]{24}$/.test(topic)||key.length<64){document.getElementById('main').innerHTML="<p class=err>הקישור לא שלם. סרקו שוב את הקוד מהטלוויזיה.</p>";return;}
window.flixSend=function(id,hash){
  var btn=document.querySelector('button');btn.disabled=true;btn.textContent='שולחים…';
  var k=unb64(key),msg=JSON.stringify({i:id,h:hash});while(msg.length<k.length)msg+=' ';
  var c=new Uint8Array(k.length);for(var i=0;i<k.length;i++)c[i]=msg.charCodeAt(i)^k[i];
  var x=new XMLHttpRequest();x.open('POST','https://ntfy.sh/'+topic,true);
  x.onload=function(){if(x.status>=200&&x.status<300){document.getElementById('main').innerHTML="<div class=ok><div class=big>✓</div><h1>נשלח לטלוויזיה!</h1><p>תוך כמה שניות הטלוויזיה תמשיך לבד. אפשר לסגור את הדף.</p></div>";}else fail();};
  x.onerror=fail;x.send(b64(c));
  function fail(){btn.disabled=false;btn.textContent='שליחה לטלוויזיה';var p=document.getElementById('err');p.textContent='השליחה נכשלה. בדקו שיש אינטרנט בטלפון ונסו שוב.';}
};
})();</script><script>(function(){var HE={'ש':'a','נ':'b','ב':'c','ג':'d','ק':'e','כ':'f','ע':'g','י':'h','ן':'i','ח':'j','ל':'k','ך':'l','צ':'m','מ':'n','ם':'o','פ':'p','/':'q','ר':'r','ד':'s','א':'t','ו':'u','ה':'v','ס':'x','ט':'y','ז':'z'};function latin(s){var o='';for(var i=0;i<s.length;i++){var c=s.charAt(i);o+=HE[c]||c;}return o;}function cleanId(s){s=(s||'').replace(/[‎‏‪-‮⁦-⁩]/g,'');var m=s.match(/\d{3,12}/g);if(m&&m.length===1)return m[0];return s.replace(/\D/g,'').slice(0,12);}function cleanHash(s){s=latin((s||'').replace(/[‎‏‪-‮⁦-⁩]/g,'')).toLowerCase();var m=s.match(/[0-9a-f]{32}/);if(m)return m[0];return s.replace(/[^0-9a-f]/g,'').slice(0,32);}function wire(input,clean,ok,state){  function run(){var v=clean(input.value);if(v!==input.value){input.value=v;}var good=ok(v);state.textContent=good?'✓':(input.name==='api_hash'?v.length+'/32':'');state.className='state'+(good?' good':'');input.className=good?'good':'';check();}  input.addEventListener('input',run);input.addEventListener('change',run);input.addEventListener('blur',run);run();}var id=document.querySelector('input[name=api_id]'),hash=document.querySelector('input[name=api_hash]'),btn=document.querySelector('button');if(!id||!hash)return;function okId(v){return /^\d{3,12}$/.test(v);}function okHash(v){return /^[0-9a-f]{32}$/.test(v);}function check(){btn.disabled=!(okId(id.value)&&okHash(hash.value));}wire(id,cleanId,okId,document.getElementById('s1'));wire(hash,cleanHash,okHash,document.getElementById('s2'));document.querySelector('form').addEventListener('submit',function(e){e.preventDefault();id.value=cleanId(id.value);hash.value=cleanHash(hash.value);if(okId(id.value)&&okHash(hash.value))window.flixSend(id.value,hash.value);});})();</script></body></html>
