<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flixgram</title>
<style>html,body{margin:0;background:#0e0b14}</style>
<script>
/* Flixgram start page on Samsung TVs. If a newer interface was downloaded earlier (tizen/host/main.js)
 * and fits this installed package, it runs here; otherwise the installed app.html runs.
 * A downloaded interface that fails to start twice is dropped. */
var FLIX_SHELL_BUILD = __BUILD__, FLIX_TDWEB_PACKAGED = '__TDWEB__';
(function () {
  var start = function () { location.replace('app.html'); };
  try {
    var o = JSON.parse(localStorage.getItem('flix:ota') || 'null');
    if (!o || !o.html || !(o.build > FLIX_SHELL_BUILD) || o.tdweb !== FLIX_TDWEB_PACKAGED) return start();
    var tried = parseInt(localStorage.getItem('flix:ota-boot'), 10) || 0;
    if (tried >= 2) {
      localStorage.setItem('flix:ota-bad', String(o.build));
      localStorage.removeItem('flix:ota');
      localStorage.removeItem('flix:ota-boot');
      return start();
    }
    localStorage.setItem('flix:ota-boot', String(tried + 1));
    document.open(); document.write(o.html); document.close();
  } catch (e) { start(); }
})();
</script>
</head>
<body></body>
</html>
