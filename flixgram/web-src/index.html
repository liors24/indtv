<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flixgram</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" data-mode="boot">
  <div id="ambient"></div>
  <div id="vignette"></div>
  <div id="gate"></div>
  <div id="shell">
    <header id="topbar">
      <div class="brand"><img src="logo.svg" alt=""><span>FLIXGRAM</span></div>
      <nav id="nav"></nav>
      <div id="clock"></div>
    </header>
    <main id="stage"></main>
  </div>
</div>
<div id="overlay"></div>
<div id="toast" role="status"></div>
<div id="intro"><div class="intro-beam"></div><img class="intro-logo" src="logo.svg" alt=""><div class="intro-word">FLIXGRAM</div><div class="intro-line">כל המדיה שלך מטלגרם, על המסך הגדול</div></div>
<!--MOCK-->
<script src="app.js"></script>
</body>
</html>
