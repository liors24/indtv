plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher version number, so a new APK installs over the old one.
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.indtv.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.indtv.app'
        minSdk 21
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            // Fixed key kept in the project so every build can update the installed app.
            storeFile file('indtv-release.jks')
            storePassword 'indtv-tv-2026'
            keyAlias 'indtv'
            keyPassword 'indtv-tv-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // The INDTV web app (../../web) is packaged as the APK's assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!tests:!README.md:!sw.js'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // The TV's own video engine for streams the web player cannot handle (MPEG-TS, AC-3, HEVC, quirky HLS)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
}
